name: ci

# Type-check, the TypeScript and Python tests, and the generated Python declarations, on every
# pull request and every push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install and build
        run: pnpm install --frozen-lockfile

      # the CLAP prober, the LV2 measurer, their interposer and the fixture plugins the tests qualify;
      # deps/ also holds openmixer's copy of the measurer, which the parity test runs beside ours, and
      # omx-clap-core's LV2 feature provider at the packages' floor, built for the measurer to link
      # asan: the measurer under AddressSanitizer, which the leak check runs
      - name: Build the native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblilv-dev lv2-dev
          make -C native deps all asan

      # plugin-hostd with pin_file (0.2.0 and after) and its fake worker, from the FreeMixer channel: the pins-file
      # test starts the real daemon on a qualified pins file. Bookworm is the suite built against the oldest glibc
      # the channel serves, which the runner's Ubuntu runs; a floor only, no ceiling.
      - name: Install plugin-hostd and its fake worker
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL --retry 5 --retry-all-errors -o /etc/apt/keyrings/freemixer.asc https://freemixer.github.io/deb/freemixer.asc
          echo "deb [signed-by=/etc/apt/keyrings/freemixer.asc] https://freemixer.github.io/deb/debian/bookworm ./" | sudo tee /etc/apt/sources.list.d/freemixer.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 'plugin-hostd (>= 0.2.0~)' plugin-hostd-tests
          echo "PLUGIN_HOSTD=/usr/bin/plugin-hostd" >> "$GITHUB_ENV"
          echo "PLUGIN_HOSTD_FAKE_HOST=/usr/libexec/plugin-hostd/tests/fake-host" >> "$GITHUB_ENV"

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Generated Python declarations are current
        run: pnpm check:generated

      - name: Python tools
        run: |
          python -m pip install --quiet pytest
          pnpm test:py

      - name: The packed package carries its build
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node packaging/check-tarball.mjs "$RUNNER_TEMP"/pack/openmixer-plugin-qualify-*.tgz

  # the RPM and the DEB are built, linted and assembled into unsigned trees; nothing is published
  packages:
    name: packages, dry run
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only
