name: ci

# Type-check, the TypeScript and Python tests, and the generated Python declarations, on every
# pull request and every push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages are built from the whole tree but the pages (docs/, the top-level *.md) and the licence: a pull
  # request that changes only those skips the dry run. main and tags run it always.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The checkout of a pull request is its merge commit and the first parent is the base, so this diff is what the
      # pull request adds. Any other event, or a diff that cannot be read, says true: main and tags always run it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || ! changed=$(git diff --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if grep -qvE '^(docs/|[^/]*\.md$|LICENSE$)' <<<"$changed"; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install and build
        run: pnpm install --frozen-lockfile

      # a public repository states facts and points into no private repository; the self-test turns
      # each kind of pointer red in each kind of file
      - name: No tracked file points into a private repository
        run: pnpm run check:private-refs

      # the overlap audit's numbers come from units found by name; its self-test proves a unit, a pair and a
      # count on a planted tree, and that a missing unit is refused rather than counted as zero
      - name: The overlap audit measures what it says
        run: tools/audit-overlap.sh --self-test

      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/install-plugin-hostd

      - uses: ./.github/actions/install-scanners

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Generated Python declarations are current
        run: pnpm check:generated

      - name: Python tools
        run: |
          python -m pip install --quiet pytest
          pnpm test:py

      - name: The packed package carries its build
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node packaging/check-tarball.mjs "$RUNNER_TEMP"/pack/openmixer-plugin-qualify-*.tgz

  # the RPM and the DEB are built, linted and assembled into unsigned trees; nothing is published
  packages:
    name: packages, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only

  # A commit message is published like a file. A pull request's own commits must carry no
  # AI-attribution line (tools/ai-trace-commit-check.sh); what is already on the base is not read.
  ai-trace:
    name: commit messages carry no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The checker catches a fixture and goes blind when its patterns are removed
        run: tools/ai-trace-commit-check.sh --selftest
      - name: Scan the commits of the pull request
        run: tools/ai-trace-commit-check.sh origin/${{ github.event.pull_request.base.ref }}..HEAD
