name: ci

# Type-check, the TypeScript and Python tests, and the generated Python declarations, on every
# pull request and every push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install and build
        run: pnpm install --frozen-lockfile

      # the CLAP prober, the LV2 measurer, their interposer and the fixture plugins the tests qualify;
      # deps/ also holds openmixer's copy of the measurer, which the parity test runs beside ours
      # asan: the measurer under AddressSanitizer, which the leak check runs
      - name: Build the native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblilv-dev lv2-dev
          make -C native deps all asan

      # the daemon and its fake worker, which src/pins-file.test.ts runs on the file the CLI wrote (it throws under CI
      # without them); plugin-hostd at a commit, the protocol library at the commit its own CI uses
      - uses: actions/checkout@v4
        with:
          repository: FreeMixer/plugin-hostd
          ref: c71528ae13e07b5811cc2747726a12c27357fc29
          path: plugin-hostd

      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@v1
        with:
          ref: ce0d247dce860051456e45d5e4e4e70d5884629f

      - name: Build plugin-hostd and its fake worker
        run: |
          set -euo pipefail
          make -C plugin-hostd plugin-hostd tests/fake-host MOD_HOST_DIR="$MOD_HOST_DIR"
          {
            echo "PLUGIN_HOSTD=$GITHUB_WORKSPACE/plugin-hostd/plugin-hostd"
            echo "PLUGIN_HOSTD_FAKE_HOST=$GITHUB_WORKSPACE/plugin-hostd/tests/fake-host"
          } >> "$GITHUB_ENV"

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Generated Python declarations are current
        run: pnpm check:generated

      - name: Python tools
        run: |
          python -m pip install --quiet pytest
          pnpm test:py

      - name: The packed package carries its build
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node packaging/check-tarball.mjs "$RUNNER_TEMP"/pack/openmixer-plugin-qualify-*.tgz

  # the RPM and the DEB are built, linted and assembled into unsigned trees; nothing is published
  packages:
    name: packages, dry run
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only
