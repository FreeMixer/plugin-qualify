name: Publish to npm

# Publishes @openmixer/plugin-qualify to npmjs.org by npm trusted publishing (OIDC, no token anywhere), with
# provenance. npmjs.com trusts the CALLER of the publish by repository + workflow filename (+ environment when
# one is set there; none is), so:
#   Repository: FreeMixer/plugin-qualify    Workflow filename: publish.yml    Environment: (none)
# A version tag publishes; a manual dispatch is a dry run unless asked otherwise. Only the public repository
# publishes: a tag on any other copy of this tree stops before npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and run `npm publish --dry-run` only'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    if: github.repository == 'FreeMixer/plugin-qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: The tag is the package's version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          else
            echo "not a tag: only a dry run makes sense here"
            test "${{ inputs.dry-run }}" = true
          fi

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # the same two steps ci.yml runs: the suite on a tag needs what the suite on a branch needs
      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/install-plugin-hostd

      - name: Build and test
        run: |
          pnpm lint
          pnpm test

      # trusted publishing needs npm 11.5.1 or newer, which node 24 carries
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run --provenance --access public
          else
            npm publish --provenance --access public
          fi
