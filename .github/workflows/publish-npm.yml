name: publish-npm

# Publishes @openmixer/plugin-qualify to npm. There is no token: npm trusted publishing exchanges this
# workflow's OIDC identity for a short-lived credential, and the package is published with provenance.
# The trusted publisher on npmjs.com names this repository and this workflow file.
#
# Run by hand, from a version tag, until the name exists on npm: npm only accepts a trusted publisher for a
# package that has been published once, so the first publish (a placeholder, as for omx-contract) and the
# trusted-publisher setting are done on npmjs.com by the owner. After that, add `push: tags: ['v*']` here.
# A dry run, the default, packs and checks everything and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and run `npm publish --dry-run` only'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: The tag is the package's version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          else
            echo "not a tag: only a dry run makes sense here"
            test "${{ inputs.dry-run }}" = true
          fi

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test

      # trusted publishing needs npm 11.5.1 or newer, which node 24 carries
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run --provenance --access public
          else
            npm publish --provenance --access public
          fi
