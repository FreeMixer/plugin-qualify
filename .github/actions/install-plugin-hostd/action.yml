name: Install plugin-hostd and its fake worker
description: plugin-hostd with pin_file (0.2.0 and after) and its fake worker, from the OpenMixer channel, for the pins-file test.

# Shared by ci.yml and publish.yml: both run the whole suite, and the pins-file test starts the real daemon on a
# qualified pins file. Bookworm is the suite built against the oldest glibc the channel serves, which the runner's
# Ubuntu runs; a floor only, no ceiling. The runner is Ubuntu, a release the openmixer-release package refuses, so the
# bookworm source is written here with the channel's key. src/workflows-agree.test.ts fails if a workflow stops using this action.

runs:
  using: composite
  steps:
    - name: Install from the OpenMixer channel
      shell: bash
      run: |
        set -euo pipefail
        sudo install -d /etc/apt/keyrings
        sudo curl -fsSL --retry 5 --retry-all-errors -o /etc/apt/keyrings/openmixer.asc https://www.openmixer.org/deb/openmixer.asc
        echo "deb [signed-by=/etc/apt/keyrings/openmixer.asc] https://www.openmixer.org/deb/debian/bookworm ./" | sudo tee /etc/apt/sources.list.d/openmixer.list
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends plugin-hostd plugin-hostd-tests
        # apt takes no version relation on the command line: the floor is checked on what it installed
        dpkg --compare-versions "$(dpkg-query -W -f='${Version}' plugin-hostd)" ge 0.2.0
        echo "PLUGIN_HOSTD=/usr/bin/plugin-hostd" >> "$GITHUB_ENV"
        echo "PLUGIN_HOSTD_FAKE_HOST=/usr/libexec/plugin-hostd/tests/fake-host" >> "$GITHUB_ENV"
