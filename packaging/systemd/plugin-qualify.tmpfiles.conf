# The sync's state is read by other users: the console scans the descriptors in /var/lib/omx/descriptors, so the
# directories are world-readable (#221). `d` also sets the mode of a directory an older install made 0700.
d /var/lib/omx 0755 root root -
d /var/lib/omx/descriptors 0755 root root -
