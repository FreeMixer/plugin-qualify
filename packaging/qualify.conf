# plugin-qualify-sync's settings: one "key value" per line. Every key is also a flag (--budget-s for
# budget_s); plugin-qualify-sync --help lists them with their defaults. A line left commented keeps the default.

# the LV2 directories, in the order plugin-hostd searches them (its lv2_path); empty is $LV2_PATH, else
# /usr/lib64/lv2:/usr/lib/lv2:/usr/local/lib/lv2
#lv2_path

# more LV2 directories after those; the default is Zynthian's two. A directory that is not there holds no plugin.
# The folders named here (and in lv2_path, clap_path, clap_extra) are also watched by plugin-qualify-sync.path:
# a change takes effect at the next boot or `systemctl daemon-reload`.
#lv2_extra /zynthian/zynthian-plugins/lv2:/zynthian/zynthian-my-data/plugins/lv2

# the CLAP directories, and more after them
#clap_path
#clap_extra

# the pin file plugin-hostd loads: put the same path in plugin-hostd's settings as pin_file
#pin_file /var/lib/omx/qualified.pins

# the wall clock one plugin gets, in seconds: past it the plugin is recorded as hung and the run goes on
#budget_s 60

# the host the verdicts are for
#host_profile omx-clap-host

# the notes an instrument that declares no voice capacity holds in a --memory-only run
#memory_notes 16

# plugin-hostd's ports: changed pins are sent to a daemon whose command socket is free; 0 sends none
#hostd_port 5555
#hostd_feedback_port 0

# the machine class whose distributed records are read (/usr/share/omx/qualification/<host class>/<set>/); empty is
# the board's own from the device tree (rpi5 on a Raspberry Pi 5), else none and the layer is not read
#host_class

# the directories of distributed records
#distributed_dir /usr/share/omx/qualification
